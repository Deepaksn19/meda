# Fig. 3(b) / Fig. 4 (blue) / Fig. 8: transfer learning. H(30,0%) is trained
# from scratch; every other agent is initialized from an already trained one.
# All agents share the unified 30x30 observation.
name: transfer_learning
base: ../training/paper_30x30_healthy.yaml
defaults:
  schedule: {epochs: 25}
stages:
  - name: s030_f00
    env: {width: 30, height: 30}
  - name: s060_f00
    init_from: s030_f00
    env: {width: 60, height: 60}
  - name: s090_f00
    init_from: s060_f00
    env: {width: 90, height: 90}
  - name: s120_f00
    init_from: s090_f00
    env: {width: 120, height: 120}
  - name: s150_f00
    init_from: s120_f00
    env: {width: 150, height: 150}
  - name: s180_f00
    init_from: s150_f00
    env: {width: 180, height: 180}
  # fault-injection chain (Fig. 8): 0% -> 10% -> 20% at the same chip size,
  # as described in Sec. V-B ("we used the agents trained on healthy biochips
  # to initialize the training against biochips with randomly injected
  # faults"). Fig. 3(b) instead draws the 10% chain across sizes
  # (30x30 10% -> 60x60 10%); use init_from: s030_f10 on a 60x60 stage for that.
  - name: s030_f10
    init_from: s030_f00
    env: {width: 30, height: 30, fault_fraction: 0.10}
    schedule: {epochs: 20}
  - name: s030_f20
    init_from: s030_f10
    env: {width: 30, height: 30, fault_fraction: 0.20}
    schedule: {epochs: 20}
  - name: s090_f10
    init_from: s090_f00
    env: {width: 90, height: 90, fault_fraction: 0.10}
    schedule: {epochs: 20}
  - name: s090_f20
    init_from: s090_f10
    env: {width: 90, height: 90, fault_fraction: 0.20}
    schedule: {epochs: 20}
